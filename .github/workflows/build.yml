name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    # The app only. Setup\MicroApp-Setup.wixproj is left out on purpose: WiX v6
    # needs a FireGiant license that hosted runners do not have, so building the
    # whole solution here would always fail. Build the MSI locally.
    - name: Restore NuGet packages
      run: nuget restore MicroApp.csproj -SolutionDirectory .

    - name: Build Debug
      run: msbuild MicroApp.csproj /p:Configuration=Debug /p:SkipCodeSigning=true

    - name: Build Release
      run: msbuild MicroApp.csproj /p:Configuration=Release /p:SkipCodeSigning=true

    # onnxruntime.dll (Remove Background) links the VC++ 2015-2022 runtime; ship it app-local
    # so the feature works on PCs without the redistributable installed
    - name: Bundle the VC++ runtime
      shell: pwsh
      run: |
        foreach ($c in 'Debug', 'Release') {
          foreach ($f in 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$f" "bin\$c\" -Force
          }
        }

    # Remove Background's IS-Net model (179 MB) is too big for the repository: it is a
    # release asset, fetched here, checked, and shipped in Models\ next to the exe
    - name: Bundle the IS-Net model
      shell: pwsh
      run: |
        $url = 'https://github.com/Mahi-BD/MicroApp/releases/download/models-1/isnet-general-use.onnx'
        $sha = '60920e99c45464f2ba57bee2ad08c919a52bbf852739e96947fbb4358c0d964a'
        Invoke-WebRequest $url -OutFile isnet-general-use.onnx
        $got = (Get-FileHash isnet-general-use.onnx -Algorithm SHA256).Hash.ToLower()
        if ($got -ne $sha) { throw "isnet-general-use.onnx hash mismatch: $got" }
        foreach ($c in 'Debug', 'Release') {
          New-Item -ItemType Directory -Force "bin\$c\Models" | Out-Null
          Copy-Item isnet-general-use.onnx "bin\$c\Models\" -Force
        }

    - name: Upload Debug artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MicroApp-Debug-${{ github.sha }}
        path: bin/Debug/
        retention-days: 7

    - name: Upload Release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MicroApp-Release-${{ github.sha }}
        path: bin/Release/
        retention-days: 30
